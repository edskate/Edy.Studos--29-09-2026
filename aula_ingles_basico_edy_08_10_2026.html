    <style>
        body {
            font-family: Arial, sans-serif;

        }
    </style>
</head>
<body>
    <h1> BASIC ENGLISH</h1>
    <p>Welcome to the basic English lesson.</p>
  
   <i> this("isto")</i>.<br>

    <i>she("ela")</i>. <br>
